<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gracias</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #020617;
      padding: 2rem 2.5rem;
      border-radius: 0.75rem;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.8);
      max-width: 480px;
      text-align: center;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 0.75rem;
    }
    p {
      margin: 0.5rem 0;
      line-height: 1.5;
    }
    a {
      display: inline-block;
      margin-top: 1.5rem;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Gracias</h1>
    <p>Gracias, te responderemos a la brevedad.</p>
    <a href="index.html">Volver al inicio</a>

</html>
